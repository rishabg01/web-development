<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form >
        <h2>Complex Form</h2>
        <br/>
        <fieldset>
            <legend>Personal Information</legend>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone">
            <label for="datefield">Date of Birth:</label>
            <input type="date" id="datefield" name="datefield">
            <label for="male">Male</label>
            <input type="radio" id="male" name="gender" >
            <label for="female">Female</label>
            <input type="radio" id="female" name="gender" >
            <label for="selectors">Country:</label placeholder="country">
            <select name="select" id="selectors">
                <option value="" disabled selected>-Select your country-</option>
                <option value="1">india</option>
                <option value="2">japan</option>
                <option value="3">usa</option>
            </select>
        </fieldset>
        <br/>
        <fieldset>
            <legend>Address Information</legend>
            <label for="address">Address:</label>
            <input type="text" id="address" name="address">
            <label for="city">City:</label>
            <input type="text" id="city" name="city">
            <label for="state">State:</label>
            <input type="text" id="state" name="state">
            <label for="zip">Zip Code:</label>
            <input type="text" id="zip" name="zip">
        </fieldset>

        <br/>
        <fieldset>
            <legend>Other Information</legend>
            <label for="comments">Comments</label>
            <textarea name="comments" id="comments" cols="30" rows="10"></textarea>
            <label for="check1">I agree to the terms and conditions</label>
            <input type="checkbox" name="check" id="check1" >
        </fieldset>
        <br/>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
