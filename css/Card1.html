<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .container{
           width: 100vw;
              height: 100vh; 
            background: linear-gradient(45deg, #8ec5fc 0.000%, #8dd3ff 25.000%, #a1d8ff 50.000%, #c1d2ff 75.000%, #e0c3ff 100.000%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card{
            width: 400px;
            height: 550px;
            background-color: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
        
            align-items: center ;
        }
        .card img{
            width: 100%;
            height: 30%;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding-bottom: 20px; 
        }
        
        .textbox{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 70%; 
            text-align: center;
            padding-bottom: 30px;
        }
        #amountbox{
            width:80%;
            height: 10%;
             background-color: #8dd3ff;
             border-radius: 10px;
             padding: 20px;
             margin-bottom: 20px;
             display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 20px;
        }
        .leftbox{
            width: fit-content;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        #paymentbutton{
            width: 80%;
            height:  9%;
            background-color: darkblue;
            border: none;
            border-radius: 10px;
            color: white;
            padding: 12px;
           box-shadow: rgba(0, 0, 0, 0.09) 0px 2px 1px, rgba(0, 0, 0, 0.379) 0px 4px 2px, rgba(0, 0, 0, 0.09) 0px 8px 4px, rgba(0, 0, 0, 0.09) 0px 16px 8px, rgba(0, 0, 0, 0.09) 0px 32px 16px;
        margin-bottom: 40px;
        }

        .cancelbox a{
            text-decoration:none;
            color: rgb(81, 76, 76);
            font-weight: bold;
        }
    .imgbox {
    width: 2.5rem;         /* Keep your fixed width */
    height: 2.5rem;        /* Keep your fixed height */
    border-radius: 50%;    /* Makes it a perfect circle */
    overflow: hidden;      /* Hides anything outside the circle */
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: white; /* Optional: Gives the transparent icon a solid backing */
    
    /* THE MAGIC FIX: */
    flex-shrink: 0;        /* Tells Flexbox: DO NOT squish this circle! */
}

.imgbox img {
    width: 100%;
    height: 100%;
    object-fit: cover; 
    border-radius: 50%;  /* 'contain' prevents the music icon from being chopped off */
}
.rightbox a{
    text-decoration: none;
    padding: 20px;
}
        
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <img src="image.jpg" alt="">

            <div class="textbox">
                <h2>Order Summary</h2>

                <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Provit beataeandae, fugilanditiis quisquam distinctio! Optio, dolore. Vero est eligendi fugiat.
                </p>
            </div>

            <div id="amountbox">
                <div class="leftbox">
                   <div class="imgbox">
                    <img src="Apple_Music_icon.svg.jpg" alt="">
                   </div>
                    <div class="textbox1">
                        <p>annual year</p>
                        <p>999.9$</p>
                    </div>
                </div>

                <div class="rightbox">
                    <a href="# ">Change</a>

                </div>

            </div>



            <button id="paymentbutton">
                Proceed to Payment
            </button>

            <div class="cancelbox">
                <a href="#">Cancel Order</a>
            </div>


    </div>
    
</body>
</html>
