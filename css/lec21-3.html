<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: beige;
            border: solid 2px black;
            display: flex;
            flex-direction: row;
            width: 450px;
            padding: 2px;
            margin: 10px;

        }
        #boxleft{
            background-color: lightgreen;
             border: solid 2px black;
             width: 47%;
             margin: 2px;
             padding: 2px;
             display: flex;
             flex-direction: column;
        }
        #boxright{
            background-color: lightblue;
             border: solid 2px black;
             width: 47%;
             margin: 2px;
             padding: 2px;
        }
        p{
            border: solid 2px black;
        }
        img{
            width: 170px;
        }
        @media(max-width: 640px){
            .container{
                flex-direction: column;
            }
    </style>
</head>
<body>
    <div class="container">
        <div id="boxleft">
            <p>text1</p>
            <p>text2</p>
        </div>

        <div id="boxright">
            <img src="premium_photo-1667119168145-a98fb5d9a275.avif"  width="400px">

        </div>
    </div>
    
</body>
</html>
