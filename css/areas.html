<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid template area</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            width: 100%;
            height: 100%;
        }
        .container{
            width: 100%;
            height: 100%;
            display: grid;
            gap: 1rem;
            background-color: rgb(33, 27, 27); 
            padding: 4rem;

            grid-template-areas:
               "header header header"
               "sidebar content1 content1"
               "sidebar content2 content3"
               "footer footer footer"
                ;
        }
        .item{
            background-color: rgb(121, 121, 159);
            border: 2px solid black;
            padding: 1rem;
        }
        #a{
            grid-area: header;
        }
        #b{
            grid-area: sidebar;
        }
        #c{
            grid-area: content1;
        }
        #d{
            grid-area: content2;
        }
        #e{
            grid-area: content3;
        }
        #f{
            grid-area: footer;
        }

    </style>

</head>
<body>
    <div class="container">
        <div class="item" id="a">Header</div>
        <div class="item" id="b">Sidebar</div>
        <div class="item" id="c">Content1</div>
        <div class="item" id="d">Content2</div>
        <div class="item" id="e">Content3</div>
        <div class="item" id="f">Footer</div>
       
    </div>
    
</body>
</html>
