<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .container{
           width: 100vw;
              height: 100vh; 
            background: linear-gradient(45deg, #8ec5fc 0.000%, #8dd3ff 25.000%, #a1d8ff 50.000%, #c1d2ff 75.000%, #e0c3ff 100.000%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card{
            width: 360px;
            height: 500px;
            background-color: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .card h2{
            font-weight: bold;
            font-size: 1.6rem;
            padding-bottom: 20px;
        }
        .card img{
            width: 100%;
            height: 60%;
        }
        
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <img src="images.jpg " alt="">

            <h2>Improve your Skills and Projects</h2>

            <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Minima, veniam.dsb cabd cdjc jkawhd c </p>

        </div>

    </div>
    
</body>
</html>
