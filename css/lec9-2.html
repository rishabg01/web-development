<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h2>Job Application:</h2>
    <form >
        <label for="name1">Name:</label>
        <input type="text" name="name1">
        <br/>
        <br/>
        <label for="email1">Email:</label>
        <input type="email" name="email1">
        <br/>
        <br/>
        <label for="phone1">Phone:</label>
        <input type="tel" name="phone1">
        <br/>
        <br/>
        <label for="resume">Resume:</label>
        <input type="file" name="resume" id="resume">
        <br/>
        <label for="experience">Experience(years):</label>
        <input type="number" name="experience" id="experience" min="0" max="50">
        <br/>
        <br/>
        <legend>Skills:</legend>
        <fieldset>
            <input type="checkbox" name="html" id="html">
            <label for="html">HTML</label>
            <br/>
            <input type="checkbox" name="css" id="css">
            <label for="css">CSS</label>
            <br/>
            <input type="checkbox" name="js" id="js">
            <label for="js">JavaScript</label>
            <br/>
            <input type="checkbox" name="python" id="python">
            <label for="python">Python</label>
        </fieldset>
            <br/>
            <br/>
            <label for="education">Highest Education:</label>
            <select name="education" id="education">
                <option value="fresher">High School</option>
                <option value="intermediate">College</option>
                <option value="expert">Postgraduate</option>
            </select>   
            <br/>
            <br/>
            <label for="time">Availability:</label>
            <br/>
            <input type="radio" name="time" id="fulltime">
            <label for="time">Full Time</label>
            <br/>
            <input type="radio" name="time" id="parttime">
            <label for="time">Part Time</label>
           <br/>
           <br/>
           <label for="comments">Additional Comments:</label>
           <br/>
           <textarea name="comments" id="comments" cols="30" rows="10"></textarea>
       <button>Register</button>
    </form> 
</body>
</html>
